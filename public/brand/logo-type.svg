<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Touchform typographic signature</title>
  <desc id="desc">Wordmark with ownable tf ligature</desc>
  <!-- Direction 3: Typographic signature -->
  <text x="16" y="62" font-family="Space Grotesk, Arial, sans-serif" font-size="48" font-weight="700" fill="#111111" letter-spacing="-2">touch</text>
  <!-- altered 'f' as rising tap stem -->
  <path d="M168 28 V70 M156 42 H188" stroke="#FF7A45" stroke-width="8" stroke-linecap="round"/>
  <text x="198" y="62" font-family="Space Grotesk, Arial, sans-serif" font-size="48" font-weight="700" fill="#111111" letter-spacing="-2">orm</text>
  <text x="292" y="62" font-family="Space Grotesk, Arial, sans-serif" font-size="28" font-weight="700" fill="#FF7A45">.md</text>
</svg>
